name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v), e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine and validate version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($v -notmatch '^[1-9]\d*\.\d+\.\d+$') {
            throw "Release version '$v' must match numeric MAJOR.MINOR.PATCH with MAJOR >= 1 for Windows MSI compatibility."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $v"

      - name: Set project version
        shell: pwsh
        run: .\mvnw.cmd -B versions:set "-DnewVersion=${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Run tests, Kover coverage, and Detekt verification
        shell: pwsh
        run: .\mvnw.cmd -B verify

      - name: Ensure supported WiX Toolset (v3-v5) is installed
        shell: pwsh
        run: |
          $candle = Get-Command candle -ErrorAction SilentlyContinue
          $light = Get-Command light -ErrorAction SilentlyContinue
          if ($candle -and $light) {
            Write-Host "Using pre-installed WiX v3: $($candle.Source)"
            return
          }

          $targetWixVersion = "5.0.2"
          $dotnetTools = Join-Path $HOME ".dotnet\tools"
          if (Test-Path $dotnetTools) {
            $env:PATH = "$dotnetTools;$env:PATH"
          }

          $wixCmd = Get-Command wix -ErrorAction SilentlyContinue
          $needsInstall = $true
          if ($wixCmd) {
            $rawVer = (& $wixCmd.Source --version | Select-Object -First 1).Trim()
            $cleanVer = ($rawVer -split '[+-]')[0]
            if ($cleanVer -match '^[45]\.\d+\.\d+$') {
              Write-Host "Found compatible WiX CLI $cleanVer at $($wixCmd.Source)"
              $targetWixVersion = $cleanVer
              $needsInstall = $false
            } else {
              Write-Host "Replacing unsupported WiX CLI version '$rawVer' with v$targetWixVersion"
              dotnet tool uninstall --global wix
            }
          }

          if ($needsInstall) {
            dotnet tool install --global wix --version $targetWixVersion
          }

          Add-Content -Path $env:GITHUB_PATH -Value $dotnetTools
          $wixExe = if ($needsInstall) { Join-Path $dotnetTools "wix.exe" } else { (Get-Command wix).Source }
          & $wixExe --version
          & $wixExe extension add --global "WixToolset.Util.wixext/$targetWixVersion" "WixToolset.UI.wixext/$targetWixVersion"

      - name: Build chained native app-image and MSI installer
        shell: pwsh
        run: .\mvnw.cmd -B package -Pjpackage-installer -DskipTests -Ddetekt.skip=true

      - name: Verify and zip native app-image and MSI artifacts
        id: artifacts
        shell: pwsh
        run: |
          $appImageDir = "target\app-image\kwswitcher"
          if (-not (Test-Path "$appImageDir\kwswitcher.exe")) {
            throw "Expected app-image launcher not found at $appImageDir\kwswitcher.exe"
          }
          $msiFiles = @(Get-ChildItem -Path "target\dist" -Filter "*.msi" -File)
          if ($msiFiles.Count -eq 0) {
            throw "Expected MSI installer not found in target\dist"
          }

          $zip = "kwswitcher-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path $appImageDir -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaged $zip and $($msiFiles[0].FullName)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: kwswitcher v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.zip }}
            target/dist/*.msi
            target/*-jar-with-dependencies.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
